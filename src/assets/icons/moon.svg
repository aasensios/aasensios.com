      <feColorMatrix
        values="0 0 0 0 0.5 0 0 0 0 0.54 0 0 0 0 0.62 0 0 0 0.22 0"
      ></feColorMatrix>
      <feComposite in2="SourceAlpha" operator="in"></feComposite>
    </filter>
