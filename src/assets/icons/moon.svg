<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <radialGradient id="moon-fill" cx="58%" cy="40%" fx="66%" fy="30%" r="62%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="1" stop-color="#e2e6ee"></stop>
    </radialGradient>
    <radialGradient id="moon-limb" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#7d8698" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#7d8698" stop-opacity="0.3"></stop>
    </radialGradient>
    <clipPath id="moon-disc">
      <circle cx="12" cy="12" r="9"></circle>
